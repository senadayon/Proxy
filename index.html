<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202124">
  <title>Web Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }

    header {
      background: #202124;
      color: white;
      padding: 20px;
      font-size: 23px;
      font-weight: bold;
    }

    .browser {
      display: flex;
      gap: 10px;
      padding: 16px;
      background: white;
      box-shadow: 0 2px 5px #0002;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 18px;
      border: 1px solid #dadce0;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 2px #4285f433;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      background: #4285f4;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #3367d6;
    }

    main {
      max-width: 850px;
      margin: 60px auto;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
    }

    .message {
      color: #5f6368;
      line-height: 1.8;
    }

    .shortcuts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .shortcut {
      display: block;
      min-width: 120px;
      padding: 18px;
      background: white;
      border-radius: 14px;
      color: #1a73e8;
      text-decoration: none;
      box-shadow: 0 2px 8px #0001;
      transition: transform 0.15s;
    }

    .shortcut:hover {
      transform: translateY(-3px);
    }

    .note {
      margin-top: 35px;
      font-size: 13px;
      color: #70757a;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      header {
        padding: 16px;
      }

      .browser {
        padding: 12px;
        gap: 7px;
      }

      input {
        padding: 12px;
      }

      button {
        padding: 12px 15px;
      }

      main {
        margin-top: 35px;
        padding: 16px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <header>🌐 Web Browser</header>

  <form class="browser" id="searchForm">
    <input
      id="url"
      type="text"
      placeholder="URLまたは検索ワードを入力"
      autocomplete="off"
      aria-label="URLまたは検索ワード"
    >

    <button type="submit">開く</button>
  </form>

  <main>
    <h1>インターネットを検索</h1>

    <p class="message">
      URLまたは検索したい言葉を入力してください。
    </p>

    <div class="shortcuts">
      <a class="shortcut"
         href="https://www.google.com/"
         target="_blank"
         rel="noopener noreferrer">
        🔎<br><br>Google
      </a>

      <a class="shortcut"
         href="https://www.youtube.com/"
         target="_blank"
         rel="noopener noreferrer">
        ▶️<br><br>YouTube
      </a>

      <a class="shortcut"
         href="https://example.com/"
         target="_blank"
         rel="noopener noreferrer">
        🌐<br><br>Example
      </a>
    </div>

    <p class="note">
      このサイトはWebページへの移動と検索をサポートします。<br>
      アクセス先のサイトやネットワークの設定によっては、
      ページを開けない場合があります。
    </p>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("searchForm");
    const input = document.getElementById("url");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const value = input.value.trim();

      if (!value) {
        input.focus();
        return;
      }

      let destination;

      if (/^https?:\/\//i.test(value)) {
        destination = value;
      } else if (
        /^[a-z0-9.-]+\.[a-z]{2,}(?::\d+)?(?:\/.*)?$/i.test(value)
      ) {
        destination = "https://" + value;
      } else {
        destination =
          "https://www.google.com/search?q=" +
          encodeURIComponent(value);
      }

      try {
        const parsed = new URL(destination);

        if (
          parsed.protocol !== "https:" &&
          parsed.protocol !== "http:"
        ) {
          alert("HTTPまたはHTTPSのURLを入力してください。");
          return;
        }

        window.location.assign(parsed.href);

      } catch (error) {
        alert("URLを確認してください。");
      }
    });
  </script>
</body>
</html>
